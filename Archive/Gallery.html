<main>
  <section class="gallery-filter-bar" aria-label="Gallery navigation">
    <div class="decade-navigator">
      <button class="decade-arrow" id="prevDecade" type="button" aria-label="Previous decade">&#8592;</button>
      <select class="decade-select" id="decadeSelect" aria-label="Select decade"></select>
      <button class="decade-arrow" id="nextDecade" type="button" aria-label="Next decade">&#8594;</button>
    </div>
    <div class="gallery-result-summary" id="gallerySummary" aria-live="polite"></div>
  </section>

  <div class="gallery-container" id="galleryContainer"></div>

  <!-- Modal overlay for expanded view -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">&times;</button>
      <img id="modalImage" src="" alt="">
      <div class="modal-caption" id="modalCaption" aria-live="polite"></div>
    </div>
  </div>

  <script>
    function toggleSidebar(button) {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('active');
      button.classList.toggle('open');
    }
  </script>

  <script src="gallery-data.js"></script>

  <script>
    const TARGET = document.getElementById('galleryContainer');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalImage = document.getElementById('modalImage');
    const modalCaption = document.getElementById('modalCaption');
    const closeModal = document.getElementById('closeModal');
    const decadeSelect = document.getElementById('decadeSelect');
    const prevDecade = document.getElementById('prevDecade');
    const nextDecade = document.getElementById('nextDecade');
    const gallerySummary = document.getElementById('gallerySummary');
    const galleryTitle = document.getElementById('galleryTitle');

    const galleryImages = Array.isArray(window.GALLERY_IMAGES) ? window.GALLERY_IMAGES : [];
    const BATCH_SIZE = 24;
    let filteredImages = [];
    let renderedCount = 0;
    let observer;

    function decadeNumber(value) {
      const n = parseInt(String(value || '').replace(/[^0-9]/g, ''), 10);
      return Number.isFinite(n) ? n : 9999;
    }

    function availableDecades() {
      return [...new Set(galleryImages.map(x => x.decade).filter(Boolean))]
        .sort((a,b) => decadeNumber(a) - decadeNumber(b));
    }

    const decades = availableDecades();
    decadeSelect.innerHTML = decades.map(d => `<option value="${d}">${d}</option>`).join('');

    const params = new URLSearchParams(location.search);
    const requestedDecade = params.get('decade');
    if (requestedDecade && decades.includes(requestedDecade)) {
      decadeSelect.value = requestedDecade;
    } else if (decades.includes('2020s')) {
      decadeSelect.value = '2020s';
    } else if (decades.length) {
      decadeSelect.value = decades[decades.length - 1];
    }


    function updateUrl() {
      const p = new URLSearchParams();
      if (decadeSelect.value) p.set('decade', decadeSelect.value);
      const query = p.toString();
      history.replaceState(null, '', location.pathname + (query ? '?' + query : '') + location.hash);
    }

    function updateNavButtons() {
      const i = decades.indexOf(decadeSelect.value);
      prevDecade.disabled = i <= 0;
      nextDecade.disabled = i < 0 || i >= decades.length - 1;
    }

    function displayDate(image) {
      if (Number.isFinite(Number(image.year))) return `${image.yearApproximate ? 'c. ' : ''}${image.year}`;
      return image.decade || '';
    }

    function buildModalMetadata(image, date) {
      const rows = [];
      if (image.event) rows.push(`<div class="modal-meta-event"></div>`);
      if (date) rows.push(`<div class="modal-meta-date"></div>`);
      if (image.caption) rows.push(`<div class="modal-meta-caption"></div>`);
      if (image.source) rows.push(`<div class="modal-meta-source"></div>`);

      modalCaption.innerHTML = rows.join('');
      if (image.event) modalCaption.querySelector('.modal-meta-event').textContent = image.event;
      if (date) modalCaption.querySelector('.modal-meta-date').textContent = date;
      if (image.caption) modalCaption.querySelector('.modal-meta-caption').textContent = image.caption;
      if (image.source) modalCaption.querySelector('.modal-meta-source').textContent = `Source: ${image.source}`;
      modalCaption.style.display = rows.length ? 'block' : 'none';
    }

    function addImageCard(image) {
      const item = document.createElement('div');
      item.className = 'gallery-item';

      const img = document.createElement('img');
      img.src = image.thumb || image.src;
      img.alt = image.alt || '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';

      const markLoaded = () => item.classList.add('loaded');
      if (img.complete && img.naturalWidth) markLoaded();
      else {
        img.addEventListener('load', markLoaded, { once: true });
        img.addEventListener('error', markLoaded, { once: true });
      }
      item.appendChild(img);

      const date = displayDate(image);
      item.addEventListener('click', () => {
        modalImage.src = image.display || image.src;
        modalImage.alt = image.alt || '';
        buildModalMetadata(image, date);
        modalOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
      TARGET.appendChild(item);
    }

    function renderNextBatch() {
      const next = filteredImages.slice(renderedCount, renderedCount + BATCH_SIZE);
      next.forEach(addImageCard);
      renderedCount += next.length;
      if (renderedCount >= filteredImages.length && observer) observer.disconnect();
    }

    function applyFilters() {
      if (observer) observer.disconnect();
      TARGET.innerHTML = '';
      renderedCount = 0;
      const decade = decadeSelect.value;

      filteredImages = galleryImages.filter(image => image.decade === decade);

      filteredImages.sort((a,b) => {
        const ya = Number.isFinite(Number(a.year)) ? Number(a.year) : 9999;
        const yb = Number.isFinite(Number(b.year)) ? Number(b.year) : 9999;
        return ya - yb || String(a.alt || '').localeCompare(String(b.alt || ''));
      });

      galleryTitle.textContent = `Gallery: ${decade || ''}`;
      updateNavButtons();
      updateUrl();
      const decadeCount = filteredImages.length;
      gallerySummary.textContent = `${decadeCount} photo${decadeCount===1?'':'s'} in ${decade}.`;

      if (!filteredImages.length) {
        TARGET.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:2rem;color:#666;">No photos match this filter.</p>';
        return;
      }

      if ('IntersectionObserver' in window) {
        observer = new IntersectionObserver((entries) => {
          if (entries.some(entry => entry.isIntersecting)) renderNextBatch();
        }, { rootMargin: '600px 0px' });
        observer.observe(sentinel);
        renderNextBatch();
      } else {
        filteredImages.forEach(addImageCard);
        renderedCount = filteredImages.length;
      }
    }

    function moveDecade(delta) {
      const i = decades.indexOf(decadeSelect.value);
      const next = i + delta;
      if (next >= 0 && next < decades.length) {
        decadeSelect.value = decades[next];
        applyFilters();
        window.scrollTo({top: document.querySelector('.gallery-filter-bar').offsetTop, behavior: 'smooth'});
      }
    }

    function closeModalFunc() {
      modalOverlay.classList.remove('active');
      modalImage.src = '';
      document.body.style.overflow = 'auto';
    }

    closeModal.addEventListener('click', closeModalFunc);
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModalFunc(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOverlay.classList.contains('active')) closeModalFunc(); });

    const sentinel = document.createElement('div');
    sentinel.style.width = '100%'; sentinel.style.height = '1px'; sentinel.setAttribute('aria-hidden','true');
    TARGET.insertAdjacentElement('afterend', sentinel);

    decadeSelect.addEventListener('change', applyFilters);
    prevDecade.addEventListener('click', () => moveDecade(-1));
    nextDecade.addEventListener('click', () => moveDecade(1));

    if (!galleryImages.length || !decades.length) {
      TARGET.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:2rem;color:#666;">No gallery images are currently listed in gallery-data.js.</p>';
      gallerySummary.textContent = 'No gallery records loaded.';
      decadeSelect.disabled = prevDecade.disabled = nextDecade.disabled = true;
    } else {
      applyFilters();
    }
  </script>
</body>
