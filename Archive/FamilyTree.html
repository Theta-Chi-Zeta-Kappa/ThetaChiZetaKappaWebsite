<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeta Kappa Family Tree</title>
  <link rel="icon" type="image/x-icon" href="img/icon.png">
  <link rel="stylesheet" href="./styleHomePage.css">
  <link rel="stylesheet" href="./styleFamilyTree.css">
</head>
<body>
  <!-- Shared Zeta Kappa website header -->
  <header class="branding-header">
    <div class="contact-us">Contact Us:</div>
    <a href="https://www.facebook.com/ThetaChiZK/"><img class="path-1" src="path-10.svg" alt="Facebook"></a>
    <a href="https://www.instagram.com/onuthetachi/"><img class="path-2" src="path-20.svg" alt="Instagram"></a>
    <a href="tel:440-563-1851"><img class="path-3" src="path-30.svg" alt="Phone"></a>
  </header>

  <header class="branding-header-large">
    <div class="rectangle-1"></div>
    <div class="hamburger" onclick="toggleSidebar(this)" role="button" tabindex="0" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <nav id="sidebar" class="sidebar" aria-label="Main navigation">
      <ul>
        <br><br><br>
        <li><a href="index.html">Home</a></li>
        <li><a href="Newsletter.html">Newsletter</a></li>
        <li><a href="Gallery.html">Gallery</a></li>
        <li><a href="Blog.html">Blog</a></li>
        <!--<li><a href="Rsvp.html">Anniversary RSVP</a></li>/-->
        <li><a href="FamilyTree.html" aria-current="page">Family Trees</a></li>
      </ul>
    </nav>
    <div class="empty"></div>
    <div class="empty"></div>
    <div class="empty"></div>
    <a href="index.html">
      <img class="_248-zeta-kappa-ohio-northern-pdf-1" src="img/mainlogo.png" alt="Theta Chi Logo" style="padding-top: 1rem">
    </a>
  </header>

  <div id="familyTreeApp" class="family-tree-page">
    <section class="family-tree-heading" aria-labelledby="pageTitle">
      <div class="eyebrow">Theta Chi · Zeta Kappa</div>
      <h1 id="pageTitle">Family Tree</h1>
      <p>Explore the generations of brotherhood within each family line.</p>
    </section>

    <main class="family-tree-main">
      <section class="controls" aria-label="Tree controls">
        <label class="family-control">Family
          <select id="familySelect" disabled><option>Loading…</option></select>
        </label>

        <div class="search-control">
          <label for="search">Find a brother</label>
          <input id="search" type="search" placeholder="Name or roster #" autocomplete="off" disabled>
          <div id="results" class="results" hidden></div>
        </div>

        <div class="view-switch" role="group" aria-label="View mode">
          <button class="active" data-view="tree" type="button">Family tree</button>
          <button data-view="lineage" type="button">Lineage</button>
          <button data-view="descendants" type="button">Descendants</button>
        </div>

        <div class="zoom-controls" role="group" aria-label="Tree zoom">
          <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
          <button id="zoomLevel" type="button" title="Reset to 100%">100%</button>
          <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
          <button id="zoomFit" type="button">Fit</button>
        </div>

        <button id="reset" class="secondary" type="button">Reset selection</button>
      </section>

      <div class="data-source">
        <span id="sourceStatus">Connecting to family database…</span>
        <span id="validationStatus" class="validation"></span>
      </div>

      <section id="status" class="status" aria-live="polite">
        <span id="statusText">Waiting for database…</span>
        <button id="detailsButton" type="button" hidden>View member details</button>
      </section>

      <section id="desktopTree" class="desktop-tree" aria-label="Family tree">
        <p class="load-message">Loading family tree…</p>
      </section>
      <section id="mobileTree" class="mobile-tree" aria-label="Family tree mobile">
        <p class="load-message">Loading family tree…</p>
      </section>
    </main>

    <dialog id="memberDialog">
      <button id="closeDialog" class="dialog-close" type="button" aria-label="Close">×</button>
      <div id="memberDetails"></div>
    </dialog>
  </div>

  <script>
    function toggleSidebar(button) {
      const sidebar = document.getElementById('sidebar');
      const isOpen = sidebar.classList.toggle('active');
      button.classList.toggle('open', isOpen);
      button.setAttribute('aria-expanded', String(isOpen));
      button.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
    }

    document.querySelector('.hamburger').addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleSidebar(this);
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="familyTreeConfig.js"></script>
  <script src="familyTreeApp.js"></script>
</body>
</html>
