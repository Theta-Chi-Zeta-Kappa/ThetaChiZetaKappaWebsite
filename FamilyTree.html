<div class="family-tree-page" id="familyTreeApp">
<section aria-labelledby="pageTitle" class="family-tree-heading">
<div class="eyebrow">Theta Chi · Zeta Kappa</div>
<h1 id="pageTitle">Family Tree</h1>
<p>Explore the generations of brotherhood within each family line.</p>
</section>
<main class="family-tree-main">
<section aria-label="Tree controls" class="controls">
<label class="family-control">Family
          <select disabled="" id="familySelect"><option>Loading…</option></select>
</label>
<div class="search-control">
<label for="search">Find a brother</label>
<input autocomplete="off" disabled="" id="search" placeholder="Name or roster #" type="search"/>
<div class="results" hidden="" id="results"></div>
</div>
<div aria-label="View mode" class="view-switch" role="group">
<button class="active" data-view="tree" type="button">Family tree</button>
<button data-view="lineage" type="button">Lineage</button>
<button data-view="descendants" type="button">Descendants</button>
</div>
<div aria-label="Tree zoom" class="zoom-controls" role="group">
<button aria-label="Zoom out" id="zoomOut" type="button">−</button>
<button id="zoomLevel" title="Reset to 100%" type="button">100%</button>
<button aria-label="Zoom in" id="zoomIn" type="button">+</button>
<button id="zoomFit" type="button">Fit</button>
</div>
<button class="secondary" id="reset" type="button">Reset selection</button>
</section>
<div class="data-source">
<span id="sourceStatus">Connecting to family database…</span>
<span class="validation" id="validationStatus"></span>
</div>
<section aria-live="polite" class="status" id="status">
<span id="statusText">Waiting for database…</span>
<button hidden="" id="detailsButton" type="button">View member details</button>
</section>
<section aria-label="Family tree" class="desktop-tree" id="desktopTree">
<p class="load-message">Loading family tree…</p>
</section>
<section aria-label="Family tree mobile" class="mobile-tree" id="mobileTree">
<p class="load-message">Loading family tree…</p>
</section>
</main>
<dialog id="memberDialog">
<button aria-label="Close" class="dialog-close" id="closeDialog" type="button">×</button>
<div id="memberDetails"></div>
</dialog>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
