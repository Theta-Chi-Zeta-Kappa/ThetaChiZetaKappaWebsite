<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCZK Admin Login</title>
<link rel="icon" href="/assets/img/icon.png" type="image/x-icon">
<link rel="stylesheet" href="/css/admin.css?v=20260910-accounts1">
</head>
<body class="admin-login-page">
<main class="login-card">
  <div class="login-brand"><img src="/assets/img/mainlogo.png" alt="Theta Chi Zeta Kappa"></div>
  <h1>Admin Login</h1>
  <p class="login-subtitle">Secure access for chapter website administrators</p>
  <form id="adminLoginForm" autocomplete="on">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" placeholder="Email address" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required></div>
    <button class="primary-btn full" type="submit">Log In</button>
  </form>
  <p class="login-note" id="loginMessage">Sign in with an authorized TCZK administrator account.</p>
</main>
<script src="/js/admin-config.js?v=20260910-accounts1"></script>
<script src="/js/admin-auth.js?v=20260910-accounts1"></script>
</body>
</html>
